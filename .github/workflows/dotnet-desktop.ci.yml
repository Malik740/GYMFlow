name: .NET CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
   
    runs-on: windows-latest

    strategy:
      matrix:
        dotnet-version: [8.0.x, 9.0.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.vbproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore --configuration Release

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      - name: Install Vale
        shell: pwsh
        run: |
            Invoke-WebRequest -Uri "https://github.com/errata-ai/vale/releases/download/v3.7.1/vale_3.7.1_Windows_64-bit.zip" -OutFile "vale.zip"
            Expand-Archive -Path "vale.zip" -DestinationPath "vale"
            echo "$PWD\vale" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Run Vale
        run: vale docs/

      - name: Run tests
        run: dotnet test --no-build --configuration Release
      - name: mkdocs
        run: mkdocs gh-deploy